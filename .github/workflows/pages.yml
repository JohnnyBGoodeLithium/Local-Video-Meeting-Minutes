name: Product site

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build data-free product site
        run: python scripts/build_product_pages.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified product site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production Pages responses
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 \
                --output /tmp/product-index.html "${base}/" && \
               curl --fail --silent --show-error --location --max-time 15 \
                --output /tmp/product.css "${base}/static/product.css" && \
               curl --fail --silent --show-error --location --max-time 15 \
                --output /tmp/product.js "${base}/static/product.js" && \
               grep --quiet 'data-design-direction="source-fold"' /tmp/product-index.html && \
               grep --quiet 'data-product-content-version="0.16"' /tmp/product-index.html; then
              echo "Production product site verified: ${base}/"
              exit 0
            fi
            echo "Pages not ready yet (attempt ${attempt}/12)"
            sleep 10
          done
          echo "Production Pages smoke failed: ${base}/" >&2
          exit 1

  publish-authorized-tag:
    name: publish-authorized-tag
    needs: deploy
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create explicitly authorized release tag
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

          version="$(tr -d '[:space:]' < VERSION)"
          release_tag="v${version}"
          authorized_tag="$(tr -d '[:space:]' < release/authorized-tag.txt)"
          if [[ "$authorized_tag" != "$release_tag" ]]; then
            echo "Release tag is not authorized: expected ${release_tag}, found ${authorized_tag}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Authorized release tag already exists: ${release_tag}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" -m "Meeting Context ${release_tag}"
          git push origin "refs/tags/${release_tag}"
