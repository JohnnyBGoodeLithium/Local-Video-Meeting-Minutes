name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-smoke:
    name: check-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements/ci.lock
          .venv/bin/pip install -e . --no-deps
          .venv/bin/pip install "pip-tools==7.6.1"

      - name: Check dependency locks
        run: make lock-check

      - name: Require a headless browser
        run: |
          command -v google-chrome \
            || command -v chromium \
            || command -v chromium-browser

      - name: Run checks
        env:
          MEETING_RESOURCE_GUARD: "0"
        run: make check

      - name: Run isolated smoke
        env:
          MEETING_RESOURCE_GUARD: "0"
        run: make smoke

      - name: Check committed whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git show --check --oneline --no-renames "${{ github.sha }}"
          fi

  release-candidate:
    name: release-candidate
    needs: check-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build development application bundle
        run: python scripts/build_release_bundle.py

      - name: Verify bundle structure
        run: python scripts/verify_release_bundle.py

      - name: Upload short-lived release candidate
        uses: actions/upload-artifact@v7
        with:
          name: application-release-candidate-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/release-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
