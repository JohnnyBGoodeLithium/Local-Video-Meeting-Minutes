name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate and release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-build-release:
    name: validate-build-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag anchor
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils

      - name: Install locked CI environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements/ci.lock
          .venv/bin/pip install -e . --no-deps
          .venv/bin/pip install pip-tools==7.6.1

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          authorized_tag="$(tr -d '[:space:]' < release/authorized-tag.txt)"
          test "$authorized_tag" = "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
          grep -Eq "^## $RELEASE_TAG([[:space:]]|$)" CHANGELOG.md
          RELEASE_TAG="$RELEASE_TAG" .venv/bin/python web/tests/release_metadata_test.py
          make lock-check
          test -z "$(git status --porcelain)"

      - name: Require a headless browser
        run: |
          command -v google-chrome \
            || command -v chromium \
            || command -v chromium-browser

      - name: Run repository checks
        env:
          MEETING_RESOURCE_GUARD: "0"
        run: make check

      - name: Run isolated smoke
        env:
          MEETING_RESOURCE_GUARD: "0"
        run: make smoke

      - name: Build official application bundle
        run: .venv/bin/python scripts/build_release_bundle.py --official

      - name: Verify release assets
        run: .venv/bin/python scripts/verify_release_bundle.py

      - name: Verify clean extraction and smoke
        run: .venv/bin/python scripts/verify_release_bundle.py --full

      - name: Create verified GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          cleanup() {
            gh release delete "$RELEASE_TAG" --yes >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/release-manifest.json \
            dist/SHA256SUMS \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          if [[ "$major" == "0" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          trap - ERR
