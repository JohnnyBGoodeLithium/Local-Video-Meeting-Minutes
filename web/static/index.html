<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要</title>
<link rel="stylesheet" href="/static/style.css?v=20260810f">
</head>
<body class="page-index">
<header class="topbar">
  <span class="brand">🎙 会议纪要</span>
  <span id="job-status" class="job-status"></span>
  <a class="toplink" href="/admin">设置</a>
</header>

<main class="layout">
  <!-- 左栏：回顾入口为主，导入与处理状态为辅 -->
  <aside class="col-left">
    <div id="dropzone">
      <input type="file" id="file-input" multiple hidden>
      <button id="pick-btn" class="primary import-button" type="button">＋ 导入会议</button>
      <span class="drop-hint">或把视频、VTT、音频拖到这里</span>
      <details class="import-options">
        <summary>导入设置</summary>
        <label class="skip-vl"><input type="checkbox" id="skip-vl"> 快速处理，不分析共享画面</label>
      </details>
    </div>
    <div id="jobs-panel" class="hidden">
      <div class="jobs-head">正在处理</div>
      <ul id="jobs-list"></ul>
    </div>
    <input id="search" type="search" placeholder="搜索会议…">
    <ul id="meeting-list"></ul>
  </aside>

  <section class="workspace">
    <header class="meeting-head">
      <div>
        <h1 id="meeting-title">选择一场会议</h1>
        <div id="meeting-meta" class="meeting-meta">阅读纪要、追问内容并修正记录</div>
      </div>
      <div class="meeting-head-actions">
        <details class="more-menu">
          <summary>更多</summary>
          <div class="more-menu-pop">
            <button id="regen-btn" type="button" disabled>重新生成纪要</button>
            <button id="refine-btn" type="button" disabled title="使用更强的本地模型优化全文">优化全文</button>
            <button id="export-btn" type="button" disabled title="无需模型，解压后双击 viewer.html">导出离线查看包</button>
            <button id="export-audio-btn" type="button" disabled>导出并包含音频</button>
            <button id="export-video-btn" type="button" disabled>导出并包含源视频</button>
            <a href="/admin">人员与高级设置</a>
          </div>
        </details>
      </div>
    </header>

    <div class="review-grid">
      <section class="transcript-pane">
        <div class="player-box">
          <div id="player-holder"><p class="placeholder">选择会议后可回放</p></div>
          <div id="timeline" class="timeline"></div>
          <div id="tl-tip" class="tl-tip hidden"></div>
        </div>
        <div class="col-header">
          <span>逐字稿</span>
          <label class="follow"><input type="checkbox" id="follow" checked> 跟随播放</label>
        </div>
        <div id="transcript" class="transcript"><p class="placeholder">← 选择一场会议</p></div>
      </section>

      <section class="minutes-pane">
        <div class="col-header"><span>会议纪要</span></div>
        <div id="minutes" class="minutes"><p class="placeholder">纪要内容</p></div>
      </section>
    </div>

    <section id="assistant-dock" class="assistant-dock">
      <div id="assistant-thread" class="assistant-thread hidden">
        <div class="assistant-thread-head">
          <b>会议助手</b>
          <button id="assistant-thread-close" type="button" aria-label="收起助手">收起</button>
        </div>
        <div id="assistant-messages" class="assistant-messages"></div>
      </div>
      <div id="assistant-refs" class="assistant-refs"></div>
      <div class="assistant-compose">
        <textarea id="assistant-input" rows="1" maxlength="8000"
                  placeholder="问这场会议，或告诉我如何修改纪要…"></textarea>
        <div class="assistant-compose-actions">
          <span id="assistant-state" class="dim"></span>
          <button id="assistant-send" class="primary" type="button">发送</button>
        </div>
      </div>
    </section>
  </section>
</main>

<div id="quote-pop" class="quote-pop hidden">
  <button type="button" data-intent="ask">问助手</button>
  <button type="button" data-intent="edit">用这段更新纪要</button>
</div>

<aside id="evidence-card" class="evidence-card hidden" aria-live="polite">
  <div class="evidence-card-head">
    <b>纪要依据</b>
    <button id="evidence-close" type="button">关闭</button>
  </div>
  <div id="evidence-body"></div>
</aside>

<!-- 说话人绑定弹框 -->
<div id="bind-mask" class="mask hidden">
  <div class="dialog">
    <h3>绑定说话人</h3>
    <p class="dim">声纹 <code id="bind-voice"></code> · 当前显示名 <b id="bind-name"></b></p>
    <audio id="bind-sample" controls preload="none"></audio>
    <input id="bind-input" list="person-list" placeholder="输入任一已确认名称；相似名称只显示候选" autocomplete="off">
    <datalist id="person-list"></datalist>
    <div id="bind-cands" class="cands"></div>
    <div class="dialog-btns">
      <button id="bind-ok" type="button">绑定（该声音全部语句）</button>
      <button id="bind-cancel" type="button">取消</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=20260810f"></script>
</body>
</html>
