<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion · 连接设备</title>
<link rel="stylesheet" href="/static/fluent-foundation.css?v=20260911p124">
<link rel="stylesheet" href="/static/companion.css?v=20260911p124">
<link rel="stylesheet" href="/static/theme.css?v=20260911p124">
<script src="/static/appearance.js?v=20260911p124"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/">Local Video Meeting Minutes</a><button id="language" class="quiet" type="button">EN</button></header>
<main><section class="view">
<p class="eyebrow">Companion · Experimental</p><h1 data-i18n="title">连接一台设备</h1>
<p class="lead" data-i18n="intro">在电脑上处理，在手机、平板或笔记本上回顾。先让设备接入同一个受控私有网络，再生成配对码。</p>
<button id="generate" class="primary" type="button" data-i18n="generate">生成配对码</button>
<p id="status" class="status" role="status"></p>
<div id="pair" hidden><h2 data-i18n="scan">用另一台设备扫描或打开配对地址</h2>
<img id="qr" alt="一次性配对二维码" width="224" height="224"><p id="code"></p><p id="url" class="lead"></p><p id="expiry" data-i18n="expiry">配对码有效期为 5 分钟。对方申请后，在下方批准连接。</p></div>
<section><div class="section-head"><h2 data-i18n="requests">等待批准</h2><button id="refresh" class="quiet" type="button" data-i18n="refresh">刷新</button></div><div id="requests" class="list"></div></section>
<section><h2 data-i18n="sessions">已配对设备</h2><div id="sessions" class="list"></div></section>
<p><a href="/" data-i18n="back">返回工作台</a></p>
</section></main>
<script src="/static/companion-setup.js?v=20260911p124" type="module"></script>
</body></html>
