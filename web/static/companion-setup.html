<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion setup</title><link rel="stylesheet" href="/static/companion.css?v=20260903p115"></head><body><header class="topbar"><span class="brand"><span class="signal"></span>Meeting Context</span></header><main><section class="view"><p class="eyebrow">Companion · Experimental</p><h1>连接一台设备</h1><p class="lead">重处理留在 X Ultra，轻交互跟着用户走。访问仅限私有 tailnet。</p><button id="generate" class="primary">生成配对码</button><div id="pair" hidden><h2>用手机打开配对地址</h2><p id="code"></p><p id="url" class="lead"></p><p id="expiry"></p></div><section><div class="section-head"><h2>等待批准</h2><button id="refresh" class="quiet">刷新</button></div><div id="requests" class="list"></div></section><section><h2>已配对设备</h2><div id="sessions" class="list"></div></section></section></main><script type="module">const $=id=>document.getElementById(id);async function call(path,options={}){const r=await fetch('/api/companion'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}async function refresh(){const [a,b]=await Promise.all([call('/admin/requests'),call('/admin/sessions')]);$('requests').replaceChildren(...a.requests.map(x=>actionRow(`${x.display_name} · ${x.identity?.name||'Mobile browser'}`,()=>decide(x.request_id,true),()=>decide(x.request_id,false))));$('sessions').replaceChildren(...b.sessions.map(x=>actionRow(`${x.display_name} · ${x.revoked?'Revoked':'Active'}`,()=>revoke(x.id))))}function actionRow(text,yes,no){const d=document.createElement('div');d.className='row';const s=document.createElement('strong');s.textContent=text;d.append(s);for(const [label,fn] of [['Allow',yes],['Deny',no]])if(fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;d.append(b)}return d}async function decide(id,allow){await call('/admin/decide',{method:'POST',body:JSON.stringify({request_id:id,allow})});refresh()}async function revoke(id){await call(`/admin/sessions/${id}/revoke`,{method:'POST'});refresh()}$('generate').onclick=async()=>{const x=await call('/admin/pairings',{method:'POST'});$('pair').hidden=false;$('code').textContent=`Short code: ${x.short_code}`;$('url').textContent=x.pairing_url||'Set MEETING_COMPANION_PUBLIC_BASE to the Tailscale Serve HTTPS origin.';$('expiry').textContent='Expires in 5 minutes'};$('refresh').onclick=refresh;refresh();setInterval(refresh,3000)</script></body></html>
