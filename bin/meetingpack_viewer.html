<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · MeetingPack</title>
<style>
:root{color-scheme:light;--bg:#f3f7ff;--panel:#fff;--text:#172033;--dim:#66758f;--line:#dfe7f3;--blue:#2f66e8;--blue-deep:#204cae;--blue-soft:#edf4ff;--warn:#9a5b00;--warn-bg:#fff7e6;--good:#067647;--good-bg:#ecfdf3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.58 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit}
.top{height:64px;padding:0 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}.top b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--dim);white-space:nowrap}.badge{margin-left:auto;padding:4px 10px;border-radius:14px;font-size:12px}.badge.ready{color:var(--good);background:var(--good-bg)}.badge.partial{color:var(--warn);background:var(--warn-bg)}
.app{display:grid;grid-template-columns:360px minmax(560px,920px) 320px;justify-content:center;min-height:calc(100vh - 64px);background:var(--bg)}aside,.main{min-width:0;background:#fff}.left{position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;border-right:1px solid var(--line);background:#f8fbff}.main{padding:0 46px 100px}.right{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:22px;border-left:1px solid var(--line);background:#f8fbff}
.player{padding:15px;border-bottom:1px solid var(--line);background:#fff}.player audio,.player video{width:100%;max-height:220px;display:block}.no-media{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--dim);background:#fafafa}.timeline{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-top:9px;color:var(--dim);font-size:12px}.timeline input{width:100%;accent-color:var(--blue)}.media-error{margin-top:7px;color:#b42318;font-size:12px}
.searchbox{padding:16px 16px 9px}.searchbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.searchbox input:focus{border-color:#9ab8f7;box-shadow:0 0 0 3px #dce9ff}.search-results{max-height:220px;overflow:auto;padding:0 10px}.result{display:block;width:100%;padding:8px 9px;border:0;border-radius:8px;text-align:left;background:transparent;color:var(--text);cursor:pointer}.result:hover{background:var(--blue-soft)}.result small{display:block;color:var(--dim)}
.pane-title{display:flex;align-items:center;justify-content:space-between;padding:11px 17px 7px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.04em}.transcript{overflow:auto;padding:0 10px 48px;scroll-behavior:smooth}.turn{padding:10px 11px 12px;border-radius:10px;border:1px solid transparent}.turn:hover{background:#fff;border-color:var(--line)}.turn.active{background:var(--blue-soft);border-color:#bfd2fa}.turn-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}.turn-head b{font-size:12px}.time{border:0;background:transparent;color:var(--blue);padding:0;cursor:pointer;font-variant-numeric:tabular-nums}.turn p{margin:0;color:#344054}
.viewbar{position:sticky;top:64px;z-index:10;margin:0 -46px;padding:18px 46px 14px;border-bottom:1px solid var(--line);background:#fffffff2;backdrop-filter:blur(10px)}.viewtabs{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.viewtabs button{border:1px solid var(--line);border-radius:20px;padding:7px 13px;background:#fff;color:#52617a;cursor:pointer}.viewtabs button:hover{border-color:#afc6f5;color:var(--blue)}.viewtabs button.active{color:var(--blue-deep);border-color:#aac4f8;background:var(--blue-soft)}.viewtabs button.primary-tab{padding:8px 18px;border-color:#aac4f8;color:var(--blue-deep);font-weight:750}.viewtabs button.primary-tab.active{color:#fff;border-color:var(--blue);background:var(--blue);box-shadow:0 5px 14px #2f66e82b}.view-desc{margin-top:8px;color:var(--dim);font-size:12px}
.warning{margin:24px auto 0;max-width:820px;padding:12px 14px;border:1px solid #fedf89;border-radius:10px;background:var(--warn-bg);color:#854a0e}.content{max-width:820px;margin:0 auto;padding-top:20px}.content h1{margin:12px 0 25px;font-size:30px;line-height:1.25;letter-spacing:-.02em}.content h2{margin-top:42px;padding-bottom:9px;border-bottom:1px solid var(--line);font-size:20px}.content h3{margin-top:30px}.content p,.content li{line-height:1.72}.content img{max-width:100%;border:1px solid var(--line);border-radius:11px}.content table{width:100%;border-collapse:collapse;max-width:100%;margin:18px 0}.content th,.content td{border:1px solid var(--line);padding:8px 11px}.content th{background:#f5f8fd}.content a[href^="#mm-"]{font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:1px 6px;white-space:nowrap}.content a[href^="#mm-"]:hover{color:var(--blue);border-color:var(--blue)}
.action-candidates{margin:22px 0;border:1px solid #f2cf91;border-radius:12px;background:#fffaf0}.action-candidates summary{padding:13px 15px;cursor:pointer}.action-candidates summary b,.action-candidates summary small{display:block}.action-candidates summary small{color:var(--dim)}.candidate-list{max-height:430px;overflow:auto;padding:0 13px 13px}.candidate{padding:10px 2px;border-top:1px solid #f0dfbf}.candidate b,.candidate small{display:block}.candidate small{margin-top:4px;color:var(--dim)}
.group{margin-top:27px}.group h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;border:0;font-size:17px}.count{font-size:11px;color:var(--dim);font-weight:400}.claim-card{display:block;width:100%;margin:8px 0;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;color:var(--text);cursor:pointer}.claim-card:hover{border-color:#a5b4fc;box-shadow:0 2px 8px #1018280b}.claim-card p{margin:6px 0 0}.claim-meta,.action-fields,.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:11px}.action-fields{margin-top:7px}.tag{padding:1px 6px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.empty{color:var(--dim)}

.topic-map{margin-top:28px;padding:28px;border:1px solid #d8e4f7;border-radius:18px;background-image:radial-gradient(#dbe6f7 1px,transparent 1px);background-size:20px 20px;background-color:#f8fbff}.topic-root{width:min(350px,100%);margin:0 auto 34px;padding:16px 20px;border-radius:14px;background:linear-gradient(135deg,#285fcf,#4380f4);color:#fff;text-align:center;box-shadow:0 8px 22px #315efb24}.topic-root small,.topic-root span{display:block;color:#e4edff}.topic-root b{display:block;margin:5px 0;font-size:18px}.topic-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.topic-branch{position:relative;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.topic-branch:before{content:"";position:absolute;left:50%;top:-23px;width:1px;height:22px;background:#aebfdb}.topic-main,.topic-child{display:block;width:100%;border:1px solid var(--line);border-radius:11px;text-align:left;cursor:pointer}.topic-main{padding:13px;background:var(--blue-soft);border-color:#c3d5f8}.topic-main b,.topic-child b{display:block}.topic-main span,.topic-child span{display:block;margin-top:5px;color:var(--dim);font-size:12px}.topic-main.active,.topic-child.active{outline:2px solid var(--blue);outline-offset:1px}.topic-children{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.topic-child{padding:10px;background:#fff}.topic-child small{color:var(--blue);font-size:10px}.topic-detail{margin-top:24px;padding:21px;border:1px solid var(--line);border-radius:14px;background:#fff}.topic-detail h2{margin:4px 0 8px;border:0}.range-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.range-buttons button{padding:6px 10px;border:1px solid #bdd1f8;border-radius:16px;background:var(--blue-soft);color:var(--blue);cursor:pointer}.topic-evidence,.topic-screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.screen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:24px}.screen-card{padding:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer;box-shadow:0 2px 10px #183b7210}.screen-card:hover{border-color:#9dbbf5;box-shadow:0 8px 22px #183b7218;transform:translateY(-1px)}.screen-card img{display:block;width:100%;height:158px;object-fit:cover;border:0;border-radius:0}.screen-card div{padding:13px}.screen-card b,.screen-card span{display:block}.screen-card b{display:-webkit-box;min-height:42px;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}.screen-card span{margin-top:6px;color:var(--dim);font-size:12px}.screen-detail{display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(280px,1fr);gap:30px;margin-top:25px}.screen-detail img{width:100%}.screen-copy h2{margin-top:0}.screen-copy .boundary{padding:9px 11px;border-left:3px solid #f79009;background:#fffaeb;color:#854a0e}.back{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);cursor:pointer}
.media-stage{position:relative;overflow:hidden;margin-bottom:9px;border:1px solid var(--line);border-radius:10px;background:#111827}.media-stage img{display:block;width:100%;aspect-ratio:16/9;max-height:190px;object-fit:contain}.media-stage.empty{min-height:105px}.media-stage.empty img{display:none}.stage-caption{position:absolute;right:0;bottom:0;left:0;padding:24px 11px 8px;background:linear-gradient(transparent,#111827ee);color:#fff;text-align:left}.stage-caption span,.stage-caption b{display:block}.stage-caption span{color:#c8d7f5;font-size:10px}.focus-ranges{position:relative;height:7px;margin:5px 42px 0;border-radius:4px;background:#e9eef7}.focus-ranges i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--blue);box-shadow:0 0 0 2px #2f66e829}.focusbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 8px;margin-top:9px;padding:8px 10px;border:1px solid #c9d9fa;border-radius:9px;background:var(--blue-soft);text-align:left}.focusbar span{grid-row:1/3;align-self:center;padding:2px 7px;border-radius:9px;background:#dbe8ff;color:var(--blue);font-size:10px}.focusbar b{grid-column:2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.focusbar small{grid-column:2;color:var(--dim)}.focusbar button{grid-column:3;grid-row:1/3;padding:4px 8px;border:1px solid #b5caf6;border-radius:9px;background:#fff;color:var(--blue);cursor:pointer}.turn.active,.turn.focus-related{background:var(--blue-soft);border-color:#9ebcf8;box-shadow:inset 3px 0 var(--blue)}.turn.focus-pulse{animation:focusPulse 1.2s ease-out}@keyframes focusPulse{0%{box-shadow:inset 3px 0 var(--blue),0 0 0 4px #2f66e830}100%{box-shadow:inset 3px 0 var(--blue),0 0 0 0 transparent}}.content a[href^="#mm-"].focus-related{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}.content tr.focus-related td,.content li.focus-related,.content p.focus-related{background:var(--blue-soft);box-shadow:inset 3px 0 var(--blue)}.topic-branch.playing{box-shadow:inset 3px 0 var(--good)}.topic-overview-stats{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.topic-overview-stats button{display:grid;grid-template-columns:auto auto;gap:5px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.topic-overview-stats b{font-size:16px}.topic-overview-stats span{color:var(--dim);font-size:11px}.topic-hint{margin-top:22px;padding:14px;border:1px dashed var(--line);border-radius:11px;color:var(--dim);text-align:center}
.right-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.right-title b{font-size:14px}.source{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.source-head{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px}.source img{max-width:100%;margin-top:8px;border-radius:6px}.evidence-claim{padding:11px;border-radius:9px;background:var(--blue-soft)}.evidence-claim p{margin:5px 0 0}.mobile-close{display:none}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:#101828;color:#fff;z-index:40;box-shadow:0 5px 20px #0003}
@media(max-width:1180px){.app{grid-template-columns:340px minmax(0,1fr)}.right{position:fixed;right:0;top:64px;width:min(380px,94vw);z-index:30;box-shadow:-8px 0 24px #0002;transform:translateX(105%);transition:.18s}.right.open{transform:none}.mobile-close{display:block;border:0;background:transparent;color:var(--blue);cursor:pointer}}
@media(max-width:760px){.top{height:60px;padding:0 16px}.top .meta{display:none}.app{display:block}.left{position:relative;top:0;height:48vh;border-bottom:1px solid var(--line)}.main{padding:0 18px 70px}.viewbar{top:60px;margin:0 -18px;padding:13px 18px 11px}.view-desc{display:none}.right{top:60px}.player video{max-height:150px}.content{padding-top:13px}.content h1{font-size:26px}.topic-map{padding:15px}.topic-branches{grid-template-columns:1fr}.topic-children{grid-template-columns:1fr}.screen-grid{grid-template-columns:1fr}.screen-card img{height:auto;max-height:220px}.screen-detail{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><b id="title"></b><span class="meta" id="meta"></span><span class="badge" id="integrity"></span></header>
<div class="app">
  <aside class="left">
    <section class="player" id="player"></section>
    <div class="searchbox"><input id="search" type="search" placeholder="搜索结论、逐字稿、页面…"></div>
    <div class="search-results" id="search-results"></div>
    <div class="pane-title"><span>完整逐字稿</span><span id="turn-count"></span></div>
    <div class="transcript" id="transcript"></div>
  </aside>
  <main class="main">
    <div class="viewbar"><div class="viewtabs" id="viewtabs"></div><div class="view-desc" id="view-desc"></div></div>
    <div id="warning"></div><article class="content" id="content"></article>
  </main>
  <aside class="right" id="evidence-panel">
    <div class="right-title"><b>原始依据</b><button class="mobile-close" id="close-evidence">关闭</button></div>
    <div id="evidence"><p class="empty">点击纪要结论、知识图节点或逐字稿，查看关联依据。</p></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
<script id="meeting-data" type="application/json">__DATA__</script>
<script>
const data=JSON.parse(document.getElementById('meeting-data').textContent),ev=data.evidence,topicMap=data.topic_map||{state:'missing',topics:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanReasoning(value){let text=String(value||'').replace(/&lt;(\/)?(think|analysis)&gt;/gi,'<$1$2>');text=text.replace(/<(think|analysis)\b[^>]*>[\s\S]*?<\/\1\s*>/gi,'');const closers=[...text.matchAll(/<\/(?:think|analysis)\s*>/gi)];if(closers.length&&!/<(?:think|analysis)\b[^>]*>/i.test(text)){const last=closers[closers.length-1];text=text.slice((last.index||0)+last[0].length)}const opener=text.match(/<(?:think|analysis)\b[^>]*>/i);if(opener)text=text.slice(0,opener.index);return text.replace(/<\/(?:think|analysis)\s*>/gi,'').replace(/<\|[^>]+\|>/g,'').trim()}
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return(h?`${h}:`:'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const turns=ev.sources.transcript||[],pages=ev.sources.pages||[],claims=ev.claims||[],turnMap=new Map(turns.map(x=>[x.id,x])),pageMap=new Map(pages.map(x=>[x.id,x])),claimMap=new Map(claims.map(x=>[x.id,x]));
const statusName={confirmed:'已确认',working_alignment:'方向共识',proposal:'提议',open:'未决',informational:'背景'};
let currentMode='topic_map',activeTurn=-1,mediaEl=null,focus={mode:'overview',time:null,ranges:[],turn_ids:[],claim_ids:[],page_ids:[]};
function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2200)}
$('#title').textContent=data.title;$('#meta').textContent=[data.date,data.duration?fmt(data.duration):'',turns.length+' 段逐字稿',data.media_path?'含媒体':'未含媒体'].filter(Boolean).join(' · ');
const integrity=data.integrity||{state:'partial',warnings:['未提供证据完整性信息。']};$('#integrity').textContent=integrity.state==='ready'?`证据完整 · ${integrity.claims}条`:`证据待完善 · ${integrity.claims||0}条`;$('#integrity').className='badge '+integrity.state;
if(integrity.warnings?.length)$('#warning').innerHTML=integrity.warnings.map(x=>`<div class="warning">${esc(x)}</div>`).join('');

function pageForTime(t){return pages.find(p=>(p.ranges||[]).some(([s,e])=>Number(s)<=t&&t<Number(e)))||null}
function representativePage(ids=[]){return ids.map(id=>pageMap.get(id)).find(p=>p?.image)||null}
function stageHtml(){if(data.media_kind==='video')return'';return'<div class="media-stage" id="media-stage"><img id="stage-image" alt=""><div class="stage-caption"><span id="stage-kicker">当前屏幕</span><b id="stage-title">正在定位屏幕内容</b></div></div>'}
function renderPlayer(){const box=$('#player'),tag=data.media_kind==='video'?'video':'audio',media=data.media_path?`<${tag} id="media" controls preload="metadata" src="${esc(data.media_path)}"></${tag}>`:'<div class="no-media"><b>本包未包含音视频</b><br>仍可用时间轴联动屏幕、逐字稿与结论。</div>';box.innerHTML=stageHtml()+media+`<div class="timeline"><span id="now">00:00</span><input id="scrub" type="range" min="0" max="${Number(data.duration)||0}" step="0.1" value="0"><span>${fmt(data.duration)}</span></div><div class="focus-ranges" id="focus-ranges"></div><div class="focusbar" id="focusbar"></div><div class="media-error" id="media-error"></div>`;mediaEl=$('#media');if(mediaEl){mediaEl.addEventListener('timeupdate',()=>focusTime(mediaEl.currentTime||0,false));mediaEl.addEventListener('loadedmetadata',()=>{$('#scrub').max=mediaEl.duration||data.duration||0});mediaEl.addEventListener('error',()=>{$('#media-error').textContent='媒体无法读取。请确认已经解压整个 MeetingPack，而不是直接从压缩软件预览 viewer.html。'})}$('#scrub').oninput=e=>focusTime(Number(e.target.value),false);$('#scrub').onchange=e=>seek(Number(e.target.value),true);focusOverview()}
function seek(t,play=true){focusTime(t,true);if(!mediaEl)return;const go=()=>{try{mediaEl.currentTime=Math.max(0,Number(t)||0);if(play)mediaEl.play().catch(()=>{})}catch(_){toast('媒体尚未准备好，请稍后重试')}};if(mediaEl.readyState===0)mediaEl.addEventListener('loadedmetadata',go,{once:true});else go()}

function renderTranscript(){const box=$('#transcript');$('#turn-count').textContent=turns.length+' 段';box.innerHTML=turns.map((t,i)=>`<section class="turn" id="turn-${i}" data-index="${i}"><div class="turn-head"><button class="time" data-time="${Number(t.start)||0}">${fmt(t.start)}</button><b>${esc(t.speaker)}</b></div><p>${esc(t.text)}</p></section>`).join('');$$('.turn .time').forEach(b=>b.onclick=e=>{e.stopPropagation();seek(Number(b.dataset.time))});$$('.turn').forEach(el=>el.onclick=()=>showTurn(turns[Number(el.dataset.index)]))}
function activateTurn(time,explicit=false){let index=-1;for(let i=0;i<turns.length;i++){if(Number(turns[i].start)<=time)index=i;else break}if(index===activeTurn&&!explicit)return;$(`#turn-${activeTurn}`)?.classList.remove('active','focus-pulse');activeTurn=index;const el=$(`#turn-${index}`);el?.classList.add('active');if(explicit)el?.classList.add('focus-pulse');if(el&&document.activeElement?.tagName!=='INPUT')el.scrollIntoView({block:explicit?'center':'nearest',behavior:'smooth'})}

function drawFocusRanges(){const box=$('#focus-ranges');if(!box)return;const duration=Number(data.duration)||1;box.innerHTML=(focus.ranges||[]).map(([s,e])=>`<i style="left:${Number(s)/duration*100}%;width:${Math.max(.7,(Number(e)-Number(s))/duration*100)}%"></i>`).join('')}
function updateStage(page,kicker='当前屏幕'){const stage=$('#media-stage');if(!stage)return;const image=$('#stage-image');stage.classList.toggle('empty',!page?.image);image.src=page?.image||'';$('#stage-kicker').textContent=kicker;$('#stage-title').textContent=page?pageTitle(page):'这一位置没有静态屏幕资料'}
function applyClaimFocus(){const ids=new Set(focus.claim_ids||[]);$$('#content .focus-related').forEach(el=>el.classList.remove('focus-related'));$$('#content a[href^="#mm-"]').forEach(a=>{const active=ids.has(a.getAttribute('href').slice(4));a.classList.toggle('focus-related',active);if(active)a.closest('tr,li,p')?.classList.add('focus-related')})}
function applyTurnFocus(explicit=false){$$('.turn.focus-related').forEach(el=>el.classList.remove('focus-related'));const ids=new Set(focus.turn_ids||[]),matches=turns.filter(t=>ids.has(t.id));matches.forEach(t=>$(`#turn-${t.index}`)?.classList.add('focus-related'));if(explicit&&matches[0])$(`#turn-${matches[0].index}`)?.scrollIntoView({block:'center',behavior:'smooth'})}
function topicMapReady(){const count=(topicMap.topics||[]).length;return topicMap.state==='ready'&&count>=3&&count<=8}
function updateFocusBar(label,title,detail,showClaims=false){const box=$('#focusbar');if(!box)return;box.innerHTML=`<span>${esc(label)}</span><b>${esc(title)}</b><small>${esc(detail)}</small>${showClaims?'<button id="focus-show-claims">查看结论</button>':''}`;$('#focus-show-claims')?.addEventListener('click',()=>{renderMinutes();requestAnimationFrame(()=>$('#content .focus-related')?.scrollIntoView({block:'center',behavior:'smooth'}))})}
function focusOverview(){focus={mode:'overview',time:null,ranges:[],turn_ids:[],claim_ids:[],page_ids:[]};const useful=pages.find(p=>p.image);updateStage(useful,'整场代表画面');drawFocusRanges();applyTurnFocus();applyClaimFocus();updateFocusBar('整场概览',topicMapReady()?`${(topicMap.topics||[]).length} 个一级论点`:'会议纪要','选择论点聚焦内容；点击时间才会播放')}
function focusTopic(topic,node=topic){focus={mode:'topic',time:null,ranges:node.ranges||topic.ranges||[],turn_ids:node.turn_ids||topic.turn_ids||[],claim_ids:node.claim_ids||topic.claim_ids||[],page_ids:node.page_ids||topic.page_ids||[]};updateStage(representativePage(focus.page_ids),'论点代表画面');drawFocusRanges();applyTurnFocus(true);applyClaimFocus();updateFocusBar('语义聚焦',node.title||topic.title,`${focus.ranges.length} 个时间范围 · ${focus.claim_ids.length} 条相关结论`,focus.claim_ids.length>0)}
function focusTime(t,explicit=false){const value=Math.max(0,Math.min(Number(data.duration)||Number(t)||0,Number(t)||0)),turn=[...turns].reverse().find(x=>Number(x.start)<=value),page=pageForTime(value),topic=topicMapReady()?(topicMap.topics||[]).find(x=>(x.ranges||[]).some(([s,e])=>Number(s)<=value&&value<Number(e))):null,claimsAt=turn?claims.filter(c=>(c.turn_ids||[]).includes(turn.id)).map(c=>c.id):[];focus={mode:'time',time:value,ranges:(topic?.ranges||[]).filter(([s,e])=>Number(s)<=value&&value<Number(e)),turn_ids:turn?[turn.id]:[],claim_ids:claimsAt,page_ids:page?[page.id]:[]};$('#now').textContent=fmt(value);$('#scrub').value=value;updateStage(page,`${fmt(value)} · 当前屏幕`);drawFocusRanges();activateTurn(value,explicit);applyTurnFocus();applyClaimFocus();updateFocusBar('已定位 '+fmt(value),page?pageTitle(page):(turn?.speaker||'逐字稿位置'),claimsAt.length?`关联 ${claimsAt.length} 条结论`:'当前没有直接关联结论',claimsAt.length>0);$$('.topic-branch.playing').forEach(el=>el.classList.remove('playing'));if(topic)$(`[data-topic-branch="${topic.id}"]`)?.classList.add('playing')}

function claimCard(id,cls='claim-card'){const c=claimMap.get(id);if(!c)return'';const a=c.kind==='action'&&c.action?`<div class="action-fields"><span>负责人：${esc(c.action.owner||'待确认')}</span><span>期限：${esc(c.action.deadline||'待确认')}</span><span>状态：${esc(c.action.status||statusName[c.status]||c.status)}</span></div>`:'';return`<button class="${cls}" data-claim="${esc(id)}"><div class="claim-meta"><span class="tag">${esc(statusName[c.status]||c.status)}</span><span>${esc(c.section||'')}</span>${c.start!=null?`<span>${fmt(c.start)}</span>`:''}</div><p>${esc(c.action?.text||c.text)}</p>${a}</button>`}
function wireClaims(){$$('[data-claim]').forEach(el=>el.onclick=()=>showClaim(el.dataset.claim))}
function candidatePanel(){const rows=ev.action_candidates||[];if(!rows.length)return'';return`<details class="action-candidates"><summary><b>另有 ${rows.length} 条待核实候选</b><small>这些生成线索尚未绑定逐字稿依据，不代表会议已经确认。</small></summary><div class="candidate-list">${rows.map((x,i)=>`<article class="candidate"><b>${String(i+1).padStart(2,'0')} · ${esc(x.text)}</b><small>负责人：${esc(x.owner||'待确认')} · 期限：${esc(x.deadline||'待确认')} · 原状态：${esc(x.original_status||'待确认')}</small></article>`).join('')}</div></details>`}
function renderMinutes(){currentMode='minutes';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='minutes'));$('#view-desc').textContent='正式记录 · 聚焦时间后，相关结论会持续高亮。';$('#content').innerHTML=data.minutes_html+candidatePanel();$$('#content a[href^="#mm-"]').forEach(a=>a.onclick=e=>{e.preventDefault();showClaim(a.getAttribute('href').slice(4))});applyClaimFocus()}
const topicTypeName={context:'背景',argument:'观点',counterpoint:'反方/约束',decision:'决定',action:'行动',open_question:'待确认',risk:'风险',evidence:'依据',discussion:'讨论'};
function rangesHtml(ranges){return(ranges||[]).map(([start,end])=>`<button data-view-seek="${Number(start)||0}">▶ ${fmt(start)}–${fmt(end)}</button>`).join('')}
function topicByNode(id){if(!id)return[null,null];for(const topic of topicMap.topics||[]){if(topic.id===id)return[topic,topic];const child=(topic.children||[]).find(x=>x.id===id);if(child)return[topic,child]}return[null,null]}
function renderTopicMap(selectedId=null){currentMode='topic_map';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='topic_map'));$('#view-desc').textContent='第一眼理解整场会议；选择论点只聚焦，点击时间才播放。';const topics=topicMap.topics||[];if(topicMap.state!=='ready'||topics.length<3||topics.length>8){$('#content').innerHTML='<h1>会议脉络</h1><p class="empty">导出时没有通过质量门槛的整场语义脉络，已保留正式会议纪要供阅读。</p>';return}const [parent,node]=topicByNode(selectedId),relatedPages=(node?.page_ids||[]).map(id=>pageMap.get(id)).filter(Boolean),confirmed=claims.filter(x=>x.status==='confirmed').length,actions=(ev.actions||[]).length,unresolved=claims.filter(x=>x.status==='open'||x.kind==='open_question').length;$('#content').innerHTML=`<h1>会议脉络</h1><p>${esc(topicMap.meeting_summary||'')}</p><div class="topic-overview-stats"><button data-open-minutes><b>${confirmed}</b><span>已确认结论</span></button><button data-open-minutes><b>${actions}</b><span>可核验待办</span></button><button data-open-minutes><b>${unresolved}</b><span>未决问题</span></button></div><div class="topic-map"><button class="topic-root" id="topic-overview"><small>整场会议</small><b>${esc(data.title)}</b><span>${topics.length} 个一级论点</span></button><div class="topic-branches">${topics.map((topic,index)=>`<section class="topic-branch" data-topic-branch="${esc(topic.id)}"><button class="topic-main ${node?.id===topic.id?'active':''}" data-topic-node="${esc(topic.id)}"><small>论点 ${String(index+1).padStart(2,'0')} · ${(topic.children||[]).length} 个结构节点</small><b>${esc(topic.title)}</b><span>${esc(topic.summary)}</span></button>${parent?.id===topic.id?`<div class="topic-children">${(topic.children||[]).map(child=>`<button class="topic-child ${node?.id===child.id?'active':''}" data-topic-node="${esc(child.id)}"><small>${esc(topicTypeName[child.type]||'讨论')}</small><b>${esc(child.title)}</b><span>${esc(child.summary)}</span></button>`).join('')}</div>`:''}</section>`).join('')}</div></div>${node?`<section class="topic-detail"><small>${node.id===parent.id?'一级论点':esc(topicTypeName[node.type]||'结构节点')} · ${esc(parent.title)}</small><h2>${esc(node.title)}</h2><p>${esc(node.summary||parent.summary)}</p><div class="range-buttons">${rangesHtml(node.ranges||parent.ranges)}</div>${(node.claim_ids||[]).length?`<h3>相关结论与依据</h3><div class="topic-evidence">${node.claim_ids.map(id=>claimCard(id)).join('')}</div>`:''}${relatedPages.length?`<h3>相关屏幕资料</h3><div class="topic-screens">${relatedPages.map(p=>screenCard(p)).join('')}</div>`:''}</section>`:'<div class="topic-hint"><b>先看整场结构，再选择一个论点</b><br>节点选择不会自动播放，时间按钮才改变播放位置。</div>'}`;$$('[data-topic-node]').forEach(b=>b.onclick=()=>{const[p,n]=topicByNode(b.dataset.topicNode);focusTopic(p,n);renderTopicMap(b.dataset.topicNode)});$$('[data-open-minutes]').forEach(b=>b.onclick=renderMinutes);$('#topic-overview').onclick=()=>{focusOverview();renderTopicMap()};wireContentLinks();applyClaimFocus()}
function pageTitle(p){const supplied=String(p.title||'').trim();if(supplied)return supplied.slice(0,100);const lines=cleanReasoning(p.visual_description).split(/\n/).map(x=>x.trim()).filter(Boolean),heading=lines.findIndex(x=>/^#{1,5}\s*标题\s*$/.test(x));if(heading>=0){const next=lines.slice(heading+1).find(x=>!x.startsWith('#'));if(next)return next.replace(/^[-*]\s*/, '').slice(0,100)}return`第 ${p.number} 页屏幕内容`}
function screenCard(p){return`<button class="screen-card" data-screen-id="${esc(p.id)}">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<div><b>${esc(pageTitle(p))}</b><span>${fmt(p.first)} · ${p.display_status==='display_only'?'仅展示':p.display_status==='discussed'?'有讨论':'动态画面'}</span></div></button>`}
function renderScreens(){currentMode='screens';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='screens'));$('#view-desc').textContent='全部屏幕资料按缩略图和标题浏览；画面展示不等于会议决定。';$('#content').innerHTML=`<h1>屏幕内容</h1><p>共 ${pages.length} 项。点击缩略图查看完整 VL 解读和出现时间。</p><div class="screen-grid">${pages.map(screenCard).join('')}</div>`;wireContentLinks()}
function renderScreen(id){const p=pageMap.get(id);if(!p)return;currentMode='screens';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='screens'));$('#view-desc').textContent='屏幕资料详情；只有明确播放按钮才改变媒体时间。';const description=cleanReasoning(p.visual_description)||'没有可用的 VL 详细解读。';$('#content').innerHTML=`<button class="back" id="back-screens">← 返回屏幕列表</button><div class="screen-detail"><div>${p.image?`<img src="${esc(p.image)}" alt="">`:'<p class="empty">没有静态截图</p>'}</div><section class="screen-copy"><small>${p.display_status==='display_only'?'仅展示':p.display_status==='discussed'?'有对应讨论':'动态画面'} · 第 ${p.number} 页</small><h2>${esc(pageTitle(p))}</h2><p class="boundary">这里只解释画面展示内容，不代表会议作出了决定。</p><div>${esc(description).replace(/\n/g,'<br>')}</div><div class="range-buttons">${rangesHtml(p.ranges||[[p.first,p.first]])}</div></section></div>`;$('#back-screens').onclick=renderScreens;wireContentLinks()}
function wireContentLinks(){$$('[data-claim]').forEach(el=>el.onclick=()=>showClaim(el.dataset.claim));$$('[data-view-seek]').forEach(el=>el.onclick=()=>seek(Number(el.dataset.viewSeek)));$$('[data-screen-id]').forEach(el=>el.onclick=()=>renderScreen(el.dataset.screenId))}
function setupTabs(){const ready=topicMapReady(),tabs=[{id:'topic_map',title:'会议脉络',primary:ready},{id:'minutes',title:'会议纪要',primary:!ready},{id:'screens',title:'屏幕内容'}];$('#viewtabs').innerHTML=tabs.map(t=>`<button data-mode="${t.id}" class="${t.primary?'primary-tab':''}">${esc(t.title)}</button>`).join('');$$('#viewtabs button').forEach(b=>b.onclick=()=>b.dataset.mode==='topic_map'?renderTopicMap():b.dataset.mode==='screens'?renderScreens():renderMinutes());return ready}

function openEvidence(html){$('#evidence').innerHTML=html;$('#evidence-panel').classList.add('open');$$('#evidence .time').forEach(b=>b.onclick=()=>seek(Number(b.dataset.time)))}
function turnSource(t){return`<div class="source"><div class="source-head"><b>${esc(t.id)} · ${esc(t.speaker)}</b><button class="time" data-time="${Number(t.start)||0}">${fmt(t.start)}</button></div><div>${esc(t.text)}</div></div>`}
function pageSource(p){return`<div class="source"><div class="source-head"><b>${esc(p.id)} · 第${p.number}页</b><button class="time" data-time="${Number(p.first)||0}">${fmt(p.first)}</button></div>${p.image?`<img src="${esc(p.image)}">`:''}<div>${esc(cleanReasoning(p.visual_description)||'没有页面文字说明')}</div></div>`}
function showClaim(id){const c=claimMap.get(id);if(!c)return;let html=`<div class="evidence-claim"><div class="tags"><span class="tag">${esc(statusName[c.status]||c.status)}</span><span class="tag">${esc(c.kind)}</span><span class="tag">置信度 ${esc(c.confidence)}</span></div><p>${esc(c.text)}</p></div>`;for(const tid of c.turn_ids||[]){const t=turnMap.get(tid);if(t)html+=turnSource(t)}for(const pid of c.page_ids||[]){const p=pageMap.get(pid);if(p)html+=pageSource(p)}if(!(c.turn_ids||[]).length&&!(c.page_ids||[]).length)html+='<p class="empty">这条内容没有关联原始依据。</p>';openEvidence(html)}
function showTurn(t){if(!t)return;const page=t.page_id&&pageMap.get(t.page_id);openEvidence(turnSource(t)+(page?pageSource(page):''));$(`#turn-${t.index}`)?.scrollIntoView({block:'center'})}
function showPage(p){if(p)openEvidence(pageSource(p))}
$('#close-evidence').onclick=()=>$('#evidence-panel').classList.remove('open');

const searchRecords=[...claims.map(x=>({type:'结论',id:x.id,text:x.text,sub:x.section})),...turns.map(x=>({type:'逐字稿',id:x.id,text:x.text,sub:`${fmt(x.start)} · ${x.speaker}`})),...pages.filter(x=>cleanReasoning(x.visual_description)).map(x=>({type:'页面',id:x.id,text:cleanReasoning(x.visual_description),sub:`第${x.number}页`}))];
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),box=$('#search-results');if(!q){box.innerHTML='';return}const hit=searchRecords.filter(x=>(x.text+' '+x.sub).toLowerCase().includes(q)).slice(0,30);box.innerHTML=hit.map(x=>`<button class="result" data-id="${esc(x.id)}"><b>${esc(x.type)}</b> ${esc(x.text.slice(0,90))}<small>${esc(x.sub)}</small></button>`).join('')||'<p class="empty">没有匹配结果</p>';$$('.result').forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(id.startsWith('C'))showClaim(id);else if(id.startsWith('T')){const t=turnMap.get(id);showTurn(t);$(`#turn-${t.index}`)?.scrollIntoView({block:'center'})}else showPage(pageMap.get(id))})};

renderPlayer();renderTranscript();const topicReady=setupTabs();if(topicReady)renderTopicMap();else renderMinutes();
</script>
</body>
</html>
