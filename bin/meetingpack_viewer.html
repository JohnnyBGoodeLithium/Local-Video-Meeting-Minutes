<body>
<header class="top"><b id="title"></b><span class="meta" id="meta"></span><span class="badge" id="integrity"></span><div class="language-switch" id="language-switch"><button data-language="zh-CN">中文</button><button data-language="en">EN</button></div></header>
<div class="app">
  <aside class="left">
    <section class="player" id="player"></section>
    <div class="searchbox"><input id="search" type="search" placeholder="搜索结论、逐字稿、页面…"></div>
    <div class="search-results" id="search-results"></div>
    <div class="pane-title"><span id="transcript-title">完整逐字稿</span><span id="turn-count"></span></div>
    <div class="transcript" id="transcript"></div>
  </aside>
  <main class="main">
    <div class="viewbar"><div class="viewtabs" id="viewtabs"></div><div class="view-desc" id="view-desc"></div></div>
    <div id="warning"></div><article class="content" id="content"></article>
  </main>
  <aside class="right" id="evidence-panel">
    <div class="right-title"><b id="evidence-title">原始依据</b><button class="mobile-close" id="close-evidence">关闭</button></div>
    <div id="evidence"><p class="empty">点击纪要结论、知识图节点或逐字稿，查看关联依据。</p></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
<div class="screen-preview" id="screen-preview" role="dialog" aria-modal="true" aria-labelledby="preview-title" hidden>
  <section class="preview-dialog">
    <header class="preview-head"><div><span id="preview-kicker">屏幕内容</span><b id="preview-title">放大查看</b></div>
      <div class="preview-tools"><button id="preview-prev" aria-label="上一屏">←</button><button id="preview-out" aria-label="缩小">−</button><button id="preview-zoom" title="恢复适应窗口">适应</button><button id="preview-in" aria-label="放大">＋</button><button id="preview-next" aria-label="下一屏">→</button><button class="preview-close" id="preview-close" aria-label="关闭">×</button></div></header>
    <div class="preview-viewport" id="preview-viewport"><img id="preview-image" alt="放大的屏幕内容"></div>
    <footer><span id="preview-meta"></span><span>←/→ 切换屏幕 · ＋/− 缩放 · Esc 关闭</span></footer>
  </section>
</div>

function renderLanes(){const box=$('#lanes');if(!box)return;const duration=Number(data.duration)||1,gap=(s,e)=>e-s<.5?'':`<i class="gap" style="left:${s/duration*100}%;width:${(e-s)/duration*100}%" title="${fmt(s)}–${fmt(e)} ${u('议题未覆盖，点击跳转','Not covered by topics; click to jump')}" data-gap="${(s+e)/2}"></i>`;let topicHtml='',cursor=0;const ranges=(topicMapReady()?(topicMap.topics||[]):[]).flatMap((t,ti)=>(t.ranges||[]).map(r=>({topic:t,ti,start:Number(r[0]),end:Number(r[1])}))).filter(r=>r.end>r.start).sort((a,b)=>a.start-b.start);for(const r of ranges){topicHtml+=gap(cursor,r.start);cursor=Math.max(cursor,r.end);topicHtml+=`<i class="topic${r.topic.low_value?' low':''}" style="left:${r.start/duration*100}%;width:${Math.max(.8,(r.end-r.start)/duration*100)}%;${r.topic.low_value?'':`background:${topicColor(r.ti)}b8`}" title="${fmt(r.start)}–${fmt(r.end)} ${esc(r.topic.title)}${r.topic.low_value?` · ${u('过渡或低讨论密度时段','Transitional or low-density segment')}`:''}" data-topic="${esc(r.topic.id)}" data-start="${r.start}"></i>`}topicHtml+=gap(cursor,duration);box.innerHTML=`<div class="lane" id="lane-topic">${topicHtml}</div><div class="lane" id="lane-spk"></div>`;renderSpkBuckets();$$('#lanes .gap').forEach(el=>el.onclick=()=>seek(Number(el.dataset.gap)));$$('#lanes .topic').forEach(el=>el.onclick=()=>{const[topic]=topicByNode(el.dataset.topic);if(topic)focusTopic(topic);seek(Number(el.dataset.start))});drawFocusRanges();applyLaneFocus()}

function renderSpkBuckets(){const lane=$('#lane-spk');if(!lane)return;const duration=Number(data.duration)||1,width=lane.clientWidth||0,buckets=Math.max(24,Math.min(360,Math.round(width/2)||180));const spans=turns.map((t,i)=>({speaker:t.speaker||u('未知','Unknown'),start:Number(t.start)||0,end:turnEnd(i)}));let html='',cursor=0;for(let b=0;b<buckets;b++){const ws=b/buckets*duration,we=(b+1)/buckets*duration;while(cursor<spans.length&&spans[cursor].end<=ws)cursor++;const shares={};for(let j=cursor;j<spans.length&&spans[j].start<we;j++){const ov=Math.min(we,spans[j].end)-Math.max(ws,spans[j].start);if(ov>0)shares[spans[j].speaker]=(shares[spans[j].speaker]||0)+ov}const top=Object.entries(shares).sort((a,b)=>b[1]-a[1])[0];if(!top)continue;html+=`<i class="seg" data-speaker="${esc(top[0])}" data-start="${ws}" style="left:${b/buckets*100}%;width:${100/buckets+.2}%;background:${spkColor(top[0])}" title="${fmt(ws)}–${fmt(we)} · ${esc(turnComp(ws,we)||top[0])}"></i>`}lane.innerHTML=html;$$('#lane-spk .seg').forEach(el=>el.onclick=e=>{e.stopPropagation();seek(Number(el.dataset.start))});applyLaneFocus()}

function renderPersonLanes(){const box=$('#person-lanes');if(!box)return;box.innerHTML='';const bar=$('#lanes-bar'),tg=$('#lanes-toggle');if(bar&&tg){bar.hidden=!turns.length;tg.textContent=personLanesOpen?u('说话人视图 ▾','Speaker view ▾'):u('说话人视图 ▸','Speaker view ▸');tg.onclick=()=>{personLanesOpen=!personLanesOpen;renderPersonLanes()}}if(!personLanesOpen||!turns.length){box.hidden=true;return}const duration=Number(data.duration)||1,runs=speakerRuns(),shown=personLanesAll?speakerOrder:speakerOrder.slice(0,6),hiddenCount=speakerOrder.length-shown.length;const row=s=>`<div class="person-lane${isUnbound(s)?' unbound':''}" data-speaker="${esc(s)}"><span class="person-lane-name" title="${esc(s)}">${esc(s)}</span><div class="person-lane-track">${runs.filter(r=>r.speaker===s&&r.end>r.start).map(r=>`<i data-start="${r.start}" style="left:${r.start/duration*100}%;width:${Math.max(.5,(r.end-r.start)/duration*100)}%;background:${spkColor(s)}" title="${fmt(r.start)}–${fmt(r.end)} ${esc(s)}"></i>`).join('')}</div></div>`;box.innerHTML=shown.map(row).join('')+unboundSpeakers.map(row).join('')+(hiddenCount>0?`<button class="person-lanes-more" id="lanes-more">${u('展开其余','Show the remaining')} ${hiddenCount} ${u('人','people')}</button>`:'');$$('#person-lanes .person-lane-track i').forEach(el=>el.onclick=()=>seek(Number(el.dataset.start)));const more=$('#lanes-more');if(more)more.onclick=()=>{personLanesAll=true;renderPersonLanes()};box.hidden=false;applyLaneFocus()}

function updateFocusBar(label,title,detail,showClaims=false,showClear=false){const box=$('#focusbar');if(!box)return;box.innerHTML=`<span>${esc(label)}</span><b>${esc(title)}</b><small>${esc(detail)}</small>${showClaims?`<button id="focus-show-claims">${u('查看结论','View conclusions')}</button>`:''}${showClear?`<button class="focus-clear" id="focus-clear">${u('返回整场','Back to overview')}</button>`:''}`;$('#focus-show-claims')?.addEventListener('click',()=>{renderMinutes();requestAnimationFrame(()=>$('#content .focus-related')?.scrollIntoView({block:'center',behavior:'smooth'}))});$('#focus-clear')?.addEventListener('click',()=>focusOverview())}
function focusOverview(){focus={mode:'overview',time:null,ranges:[],turn_ids:[],claim_ids:[],page_ids:[]};const useful=pages.find(p=>p.image),count=(topicMap.topics||[]).length;updateStage(useful,u('整场代表画面','Meeting overview screen'));drawFocusRanges();applyTurnFocus();applyClaimFocus();applyLaneFocus();updateFocusBar(u('整场概览','Meeting overview'),topicMapReady()?u(`${count} 个一级议题`,`${count} primary topics`):u('会议纪要','Minutes'),u('选择议题聚焦内容；点击时间才会播放','Select a topic to focus; click a time to play'))}
function focusTopic(topic,node=topic){focus={mode:'topic',time:null,ranges:node.ranges||topic.ranges||[],turn_ids:node.turn_ids||topic.turn_ids||[],claim_ids:node.claim_ids||topic.claim_ids||[],page_ids:node.page_ids||topic.page_ids||[]};updateStage(representativePage(focus.page_ids),u('议题代表画面','Topic screen'));drawFocusRanges();applyTurnFocus(true);applyClaimFocus();applyLaneFocus();updateFocusBar(u('语义聚焦','Semantic focus'),node.title||topic.title,u(`${focus.ranges.length} 个时间范围 · ${focus.claim_ids.length} 条相关结论`,`${focus.ranges.length} time ranges · ${focus.claim_ids.length} related conclusions`),focus.claim_ids.length>0)}
function focusTime(t,explicit=false){const value=Math.max(0,Math.min(Number(data.duration)||Number(t)||0,Number(t)||0)),turn=[...turns].reverse().find(x=>Number(x.start)<=value),page=pageForTime(value),topic=topicMapReady()?(topicMap.topics||[]).find(x=>(x.ranges||[]).some(([s,e])=>Number(s)<=value&&value<Number(e))):null,claimsAt=turn?claims.filter(c=>(c.turn_ids||[]).includes(turn.id)).map(c=>c.id):[];focus={mode:'time',time:value,ranges:(topic?.ranges||[]).filter(([s,e])=>Number(s)<=value&&value<Number(e)),turn_ids:turn?[turn.id]:[],claim_ids:claimsAt,page_ids:page?[page.id]:[]};$('#now').textContent=fmt(value);$('#scrub').value=value;updateStage(page,`${fmt(value)} · ${u('当前屏幕','Current screen')}`);drawFocusRanges();activateTurn(value,explicit);applyTurnFocus();applyClaimFocus();applyLaneFocus();updateFocusBar(`${u('已定位','Located at')} ${fmt(value)}`,page?pageTitle(page):(turn?.speaker||u('逐字稿位置','Transcript position')),claimsAt.length?u(`关联 ${claimsAt.length} 条结论`,`${claimsAt.length} related conclusions`):u('当前没有直接关联结论','No directly related conclusions'),claimsAt.length>0);$$('.topic-branch.playing').forEach(el=>el.classList.remove('playing'));if(topic)$(`[data-topic-branch="${topic.id}"]`)?.classList.add('playing')}

function claimCard(id,cls='claim-card'){const c=claimMap.get(id);if(!c)return'';const a=c.kind==='action'&&c.action?`<div class="action-fields"><span>负责人：${esc(c.action.owner||'待确认')}</span><span>期限：${esc(c.action.deadline||'待确认')}</span><span>状态：${esc(c.action.status||statusName[c.status]||c.status)}</span></div>`:'';return`<button class="${cls}" data-claim="${esc(id)}"><div class="claim-meta"><span class="tag">${esc(statusName[c.status]||c.status)}</span><span>${esc(c.section||'')}</span>${c.start!=null?`<span>${fmt(c.start)}</span>`:''}</div><p>${esc(c.action?.text||c.text)}</p>${a}</button>`}
function wireClaims(){$$('[data-claim]').forEach(el=>el.onclick=()=>showClaim(el.dataset.claim))}
function candidatePanel(){const rows=ev.action_candidates||[];if(!rows.length)return'';return`<details class="action-candidates"><summary><b>${u(`另有 ${rows.length} 条待核实候选`,`${rows.length} unverified candidates`)}</b><small>${u('这些生成线索尚未绑定逐字稿依据，不代表会议已经确认。','These generated clues are not linked to transcript evidence and are not confirmed.')}</small></summary><div class="candidate-list">${rows.map((x,i)=>`<article class="candidate"><b>${String(i+1).padStart(2,'0')} · ${esc(x.text)}</b><small>${u('负责人','Owner')}：${esc(x.owner||u('待确认','Unconfirmed'))} · ${u('期限','Due')}：${esc(x.deadline||u('待确认','Unconfirmed'))} · ${u('原状态','Source status')}：${esc(x.original_status||u('待确认','Unconfirmed'))}</small></article>`).join('')}</div></details>`}
function renderMinutes(){currentMode='minutes';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='minutes'));$('#view-desc').textContent=u('正式记录 · 聚焦时间后，相关结论会持续高亮。','Formal record · Related conclusions remain highlighted as you focus the timeline.');const minutes=data.minutes_languages?.[language]?.html||data.minutes_html;$('#content').innerHTML=minutes+candidatePanel();$$('#content a[href^="#mm-"]').forEach(a=>a.onclick=e=>{e.preventDefault();showClaim(a.getAttribute('href').slice(4))});applyClaimFocus()}
const topicTypeNames={'zh-CN':{context:'背景',argument:'观点',counterpoint:'反方/约束',decision:'决定',action:'行动',open_question:'待确认',risk:'风险',evidence:'依据',discussion:'讨论'},en:{context:'Context',argument:'Argument',counterpoint:'Constraint',decision:'Decision',action:'Action',open_question:'Open question',risk:'Risk',evidence:'Evidence',discussion:'Discussion'}};
const topicTypeName=type=>topicTypeNames[language]?.[type]||u('讨论','Discussion');
function rangesHtml(ranges){return(ranges||[]).map(([start,end])=>`<button data-view-seek="${Number(start)||0}">▶ ${fmt(start)}–${fmt(end)}</button>`).join('')}
function topicByNode(id){if(!id)return[null,null];for(const topic of topicMap.topics||[]){if(topic.id===id)return[topic,topic];const child=(topic.children||[]).find(x=>x.id===id);if(child)return[topic,child]}return[null,null]}
function renderTopicMap(selectedId=null){currentMode='topic_map';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='topic_map'));$('#view-desc').textContent=u('第一眼理解整场会议；选择议题只聚焦，点击时间才播放。','Understand the whole meeting at a glance; selecting a topic focuses it, while only a time button starts playback.');const topics=topicMap.topics||[];if(topicMap.state!=='ready'||topics.length<3||topics.length>8){$('#content').innerHTML=`<h1>${u('会议脉络','Meeting map')}</h1><p class="empty">${u('导出时没有通过质量门槛的整场语义脉络，已保留正式会议纪要供阅读。','No meeting-wide semantic map passed the quality gate at export time. The formal minutes remain available.')}</p>`;return}const [parent,node]=topicByNode(selectedId),topicIndex=topics.findIndex(t=>t.id===parent?.id),detailHtml=node?`<section class="topic-detail" style="border-left:3px solid ${topicColor(topicIndex<0?0:topicIndex)}"><small>${node.id===parent.id?u('一级议题','Primary topic'):esc(topicTypeName(node.type)||u('结构节点','Structured node'))} · ${esc(parent.title)}</small><h2>${esc(node.title)}</h2><p>${esc(node.summary||parent.summary)}</p><div class="range-buttons">${rangesHtml(node.ranges||parent.ranges)}</div>${(node.claim_ids||[]).length?`<h3>${u('相关结论与依据','Related conclusions and evidence')}</h3><div class="topic-evidence">${node.claim_ids.map(id=>claimCard(id)).join('')}</div>`:''}${relatedPages.length?`<h3>${u('相关屏幕资料','Related screen content')}</h3><div class="topic-screens">${relatedPages.map(p=>screenCard(p)).join('')}</div>`:''}</section>`:'',relatedPages=(node?.page_ids||[]).map(id=>pageMap.get(id)).filter(Boolean),confirmed=claims.filter(x=>x.status==='confirmed').length,actions=(ev.actions||[]).length,unresolved=claims.filter(x=>x.status==='open'||x.kind==='open_question').length;$('#content').innerHTML=`<h1>${u('会议脉络','Meeting map')}</h1><p>${esc(topicMap.meeting_summary||'')}</p><div class="topic-overview-stats"><button data-open-minutes><b>${confirmed}</b><span>${u('已确认结论','Confirmed conclusions')}</span></button><button data-open-minutes><b>${actions}</b><span>${u('可核验待办','Verifiable actions')}</span></button><button data-open-minutes><b>${unresolved}</b><span>${u('未决问题','Open questions')}</span></button></div><div class="topic-map"><button class="topic-root" id="topic-overview"><small>${u('整场会议','Whole meeting')}</small><b>${esc(data.title)}</b><span>${u(`${topics.length} 个一级议题`,`${topics.length} primary topics`)}</span></button><div class="topic-branches">${topics.map((topic,index)=>`<section class="topic-branch" data-topic-branch="${esc(topic.id)}"><button class="topic-main ${node?.id===topic.id?'active':''}" data-topic-node="${esc(topic.id)}"><small>${u('议题','Topic')} ${String(index+1).padStart(2,'0')} · ${u(`${(topic.children||[]).length} 个结构节点`,`${(topic.children||[]).length} structured nodes`)}</small><b>${esc(topic.title)}</b><span>${esc(topic.summary)}</span></button>${parent?.id===topic.id?`<div class="topic-children">${(topic.children||[]).map(child=>`<button class="topic-child ${node?.id===child.id?'active':''}" data-topic-node="${esc(child.id)}"><small>${esc(topicTypeName(child.type))}</small><b>${esc(child.title)}</b><span>${esc(child.summary)}</span></button>`).join('')}</div>`:''}</section>${parent?.id===topic.id?detailHtml:''}`).join('')}</div></div>${node?'':`<div class="topic-hint"><b>${u('先看整场结构，再选择一个议题','Scan the whole structure, then select a topic')}</b><br>${u('节点选择不会自动播放，时间按钮才改变播放位置。','Selecting a node does not start playback; only a time button changes the media position.')}</div>`}`;$$('[data-topic-node]').forEach(b=>b.onclick=()=>{const[p,n]=topicByNode(b.dataset.topicNode);focusTopic(p,n);renderTopicMap(b.dataset.topicNode)});$$('[data-open-minutes]').forEach(b=>b.onclick=renderMinutes);$('#topic-overview').onclick=()=>{focusOverview();renderTopicMap()};wireContentLinks();applyClaimFocus()}
function pageTitle(p){const supplied=String(p.title||'').trim();if(supplied)return supplied.slice(0,100);const lines=cleanReasoning(p.visual_description).split(/\n/).map(x=>x.trim()).filter(Boolean),heading=lines.findIndex(x=>/^#{1,5}\s*标题\s*$/.test(x));if(heading>=0){const next=lines.slice(heading+1).find(x=>!x.startsWith('#'));if(next)return next.replace(/^[-*]\s*/, '').slice(0,100)}return`第 ${p.number} 页屏幕内容`}
function screenCard(p){return`<button class="screen-card" data-screen-id="${esc(p.id)}">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<div><b>${esc(pageTitle(p))}</b><span>${fmt(p.first)} · ${p.display_status==='display_only'?'仅展示':p.display_status==='discussed'?'有讨论':'动态画面'}</span></div></button>`}
function renderScreens(){currentMode='screens';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='screens'));$('#view-desc').textContent='全部屏幕资料按缩略图和标题浏览；画面展示不等于会议决定。';$('#content').innerHTML=`<h1>屏幕内容</h1><p>共 ${pages.length} 项。点击缩略图查看完整 VL 解读和出现时间。</p><div class="screen-grid">${pages.map(screenCard).join('')}</div>`;wireContentLinks()}
function renderScreen(id){const p=pageMap.get(id);if(!p)return;currentMode='screens';$$('#viewtabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='screens'));$('#view-desc').textContent='屏幕资料详情；只有明确播放按钮才改变媒体时间。';const description=cleanReasoning(p.visual_description)||'没有可用的 VL 详细解读。';$('#content').innerHTML=`<button class="back" id="back-screens">← 返回屏幕列表</button><div class="screen-detail"><div>${p.image?`<img src="${esc(p.image)}" alt="" data-preview-page="${esc(p.id)}" title="点击放大查看">`:'<p class="empty">没有静态截图</p>'}</div><section class="screen-copy"><small>${p.display_status==='display_only'?'仅展示':p.display_status==='discussed'?'有对应讨论':'动态画面'} · 第 ${p.number} 页</small><h2>${esc(pageTitle(p))}</h2><p class="boundary">这里只解释画面展示内容，不代表会议作出了决定。</p><div>${esc(description).replace(/\n/g,'<br>')}</div><div class="range-buttons">${rangesHtml(p.ranges||[[p.first,p.first]])}</div></section></div>`;$('#back-screens').onclick=renderScreens;wireContentLinks()}
function wireContentLinks(){$$('[data-claim]').forEach(el=>el.onclick=()=>showClaim(el.dataset.claim));$$('[data-view-seek]').forEach(el=>el.onclick=()=>seek(Number(el.dataset.viewSeek)));$$('[data-screen-id]').forEach(el=>el.onclick=()=>renderScreen(el.dataset.screenId));$$('[data-preview-page]').forEach(el=>el.onclick=()=>openScreenPreview(el.dataset.previewPage))}
function setupTabs(){const ready=topicMapReady(),tabs=[{id:'topic_map',title:u('会议脉络','Meeting map'),primary:ready},{id:'minutes',title:u('会议纪要','Minutes'),primary:!ready},{id:'screens',title:u('屏幕内容','Screen content')}];$('#viewtabs').innerHTML=tabs.map(t=>`<button data-mode="${t.id}" class="${t.primary?'primary-tab':''}">${esc(t.title)}</button>`).join('');$$('#viewtabs button').forEach(b=>b.onclick=()=>b.dataset.mode==='topic_map'?renderTopicMap():b.dataset.mode==='screens'?renderScreens():renderMinutes());return ready}

function openEvidence(html){$('#evidence').innerHTML=html;$('#evidence-panel').classList.add('open');$$('#evidence .time').forEach(b=>b.onclick=()=>seek(Number(b.dataset.time)))}
function turnSource(t){return`<div class="source"><div class="source-head"><b>${esc(t.id)} · ${esc(t.speaker)}</b><button class="time" data-time="${Number(t.start)||0}">${fmt(t.start)}</button></div><div>${esc(t.text)}</div></div>`}
function pageSource(p){return`<div class="source"><div class="source-head"><b>${esc(p.id)} · 第${p.number}页</b><button class="time" data-time="${Number(p.first)||0}">${fmt(p.first)}</button></div>${p.image?`<img src="${esc(p.image)}">`:''}<div>${esc(cleanReasoning(p.visual_description)||'没有页面文字说明')}</div></div>`}
function showClaim(id){const c=claimMap.get(id);if(!c)return;let html=`<div class="evidence-claim"><div class="tags"><span class="tag">${esc(statusName[c.status]||c.status)}</span><span class="tag">${esc(c.kind)}</span><span class="tag">置信度 ${esc(c.confidence)}</span></div><p>${esc(c.text)}</p></div>`;for(const tid of c.turn_ids||[]){const t=turnMap.get(tid);if(t)html+=turnSource(t)}for(const pid of c.page_ids||[]){const p=pageMap.get(pid);if(p)html+=pageSource(p)}if(!(c.turn_ids||[]).length&&!(c.page_ids||[]).length)html+='<p class="empty">这条内容没有关联原始依据。</p>';openEvidence(html)}
function showTurn(t){if(!t)return;const page=t.page_id&&pageMap.get(t.page_id);openEvidence(turnSource(t)+(page?pageSource(page):''));$(`#turn-${t.index}`)?.scrollIntoView({block:'center'})}
function showPage(p){if(p)openEvidence(pageSource(p))}
$('#close-evidence').onclick=()=>$('#evidence-panel').classList.remove('open');
$('#preview-close').onclick=closeScreenPreview;$('#preview-prev').onclick=()=>navigatePreview(-1);$('#preview-next').onclick=()=>navigatePreview(1);$('#preview-out').onclick=()=>changePreviewZoom(-1);$('#preview-in').onclick=()=>changePreviewZoom(1);$('#preview-zoom').onclick=()=>{preview.zoomIndex=0;applyPreviewZoom()};$('#preview-image').ondblclick=()=>{preview.zoomIndex=preview.zoomIndex?0:3;applyPreviewZoom()};$('#screen-preview').onclick=e=>{if(e.target.id==='screen-preview')closeScreenPreview()};document.addEventListener('keydown',e=>{if($('#screen-preview').hidden)return;const actions={Escape:closeScreenPreview,ArrowLeft:()=>navigatePreview(-1),ArrowRight:()=>navigatePreview(1),'+':()=>changePreviewZoom(1),'=':()=>changePreviewZoom(1),'-':()=>changePreviewZoom(-1)};if(!actions[e.key])return;e.preventDefault();e.stopImmediatePropagation();actions[e.key]()},{capture:true});

const searchRecords=[...claims.map(x=>({type:'结论',id:x.id,text:x.text,sub:x.section})),...turns.map(x=>({type:'逐字稿',id:x.id,text:x.text,sub:`${fmt(x.start)} · ${x.speaker}`})),...pages.filter(x=>cleanReasoning(x.visual_description)).map(x=>({type:'页面',id:x.id,text:cleanReasoning(x.visual_description),sub:`第${x.number}页`}))];
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),box=$('#search-results');if(!q){box.innerHTML='';return}const hit=searchRecords.filter(x=>(x.text+' '+x.sub).toLowerCase().includes(q)).slice(0,30);box.innerHTML=hit.map(x=>`<button class="result" data-id="${esc(x.id)}"><b>${esc(x.type)}</b> ${esc(x.text.slice(0,90))}<small>${esc(x.sub)}</small></button>`).join('')||'<p class="empty">没有匹配结果</p>';$$('.result').forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(id.startsWith('C'))showClaim(id);else if(id.startsWith('T')){const t=turnMap.get(id);showTurn(t);$(`#turn-${t.index}`)?.scrollIntoView({block:'center'})}else showPage(pageMap.get(id))})};

$$('[data-language]').forEach(button=>button.onclick=()=>{if(!data.minutes_languages?.[button.dataset.language])return;language=button.dataset.language;localStorage.setItem('meetingpack:language',language);applyLanguage();renderTranscript();const topicReady=setupTabs();if(currentMode==='minutes'||!topicReady)renderMinutes();else if(currentMode==='screens')renderScreens();else renderTopicMap()});

let laneResizeTimer=null;window.addEventListener('resize',()=>{clearTimeout(laneResizeTimer);laneResizeTimer=setTimeout(renderSpkBuckets,180)});
renderPlayer();renderTranscript();const topicReady=setupTabs();if(topicReady)renderTopicMap();else renderMinutes();
</script>
