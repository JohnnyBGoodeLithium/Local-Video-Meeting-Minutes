[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meeting-minutes"
version = "0.16.0"
description = "Local-first meeting and video context workflow with evidence-linked review and portable knowledge outputs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "JohnnyBGoodeLithium" },
]
keywords = [
  "local-ai",
  "meeting-intelligence",
  "multimodal",
  "rag",
  "knowledge-management",
  "edge-ai",
]
dependencies = [
  "aiofiles>=23",
  "fastapi>=0.110",
  "linkify-it-py>=2.0",
  "markdown-it-py>=3",
  "python-multipart>=0.0.9",
  "qrcode>=8.2",
  "uvicorn>=0.29",
  "yt-dlp>=2025.1.26",
]

[project.optional-dependencies]
ci = [
  "numpy>=1.26",
  "Pillow>=10",
  "soundfile>=0.12",
]

pipeline = [
  "numpy>=1.26",
  "Pillow>=10",
  "pyannote.audio>=4",
  "qwen-asr",
  "soundfile>=0.12",
]

lock = [
  "pip-tools==7.6.1",
]

[project.urls]
Repository = "https://github.com/JohnnyBGoodeLithium/Local-Video-Meeting-Minutes"
Documentation = "https://github.com/JohnnyBGoodeLithium/Local-Video-Meeting-Minutes/tree/main/docs"
Changelog = "https://github.com/JohnnyBGoodeLithium/Local-Video-Meeting-Minutes/blob/main/CHANGELOG.md"
Issues = "https://github.com/JohnnyBGoodeLithium/Local-Video-Meeting-Minutes/issues"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py311"
